name: superagent-request

on:
  workflow_dispatch:
    inputs:
      text:
        description: '给 dsh-superagent 的请求内容'
        required: true
        type: string

permissions:
  issues: write

jobs:
  request:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const text = context.payload.inputs.text;
            const title = (text.split('\n')[0] || 'request').slice(0, 60);
            const { data } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[request] ${title}`,
              body: `@baojingyu\n\n${text}`,
            });
            core.notice(`created issue #${data.number}`);
